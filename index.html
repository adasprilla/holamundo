<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HolaMundo — 3D Configurator</title>
<meta name="description" content="Parametric 3D configurator by Daniel Asprilla. Adjust height, sections and attraction point, export STL or 3DM. Runs locally in your browser.">
<meta name="author" content="Daniel Asprilla">
<meta property="og:title" content="HolaMundo — 3D Configurator">
<meta property="og:description" content="Parametric 3D viewer with STL and 3DM export.">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:,">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "rhino3dm": "https://cdn.jsdelivr.net/npm/rhino3dm@8.0.1/rhino3dm.module.js"
  }
}
</script>
</head>
<body>
  <aside class="panel controls">
    <header>
      <h1>HolaMundo</h1>
      <p class="sub">Parametric configurator · by Daniel Asprilla · Personal project</p>
    </header>

    <div id="controls"></div>
    <button id="reset" type="button" class="ghost">Reset</button>

    <section class="export">
      <h2>Export</h2>
      <button id="export-stl" type="button">STL</button>
      <button id="export-3dm" type="button">3DM</button>
      <p id="export-note" class="note" aria-live="polite"></p>
    </section>

    <div class="support-section">
      <p>You can support this App on</p>
      <a href="https://www.paypal.com/paypalme/adasprilla" target="_blank" rel="noopener noreferrer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="#003087" aria-hidden="true"><path d="M7.5 2.5h8c1.5 0 2.8.4 3.8 1.1 1 .7 1.7 1.7 1.9 2.9.1.6.1 1.2 0 1.9-.1.7-.4 1.4-.8 2.1-.4.7-1 1.2-1.7 1.6-.7.4-1.6.6-2.6.6h-2.2c-.5 0-1 .1-1.4.3-.4.2-.7.5-.9.9l-2.3 7.3H6.5l2.8-8.9c.1-.4.3-.7.6-.9.3-.2.6-.3 1-.3h2c.8 0 1.4-.2 1.9-.6.4-.4.7-.9.8-1.5.1-.5 0-1-.3-1.4-.3-.4-.8-.6-1.5-.6h-5c-.4 0-.7.1-1 .3-.2.2-.4.5-.5.9L7.5 2.5z"/></svg>
        PayPal
      </a>
    </div>

    <p class="note footer">This web app runs 100% locally in your browser. It does not collect personal data or request passwords.</p>
  </aside>

  <main id="view">
    <canvas id="canvas"></canvas>
    <p class="hint">drag to orbit · scroll to zoom</p>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
